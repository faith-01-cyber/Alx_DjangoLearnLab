<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Comment</title>
</head>
<body>
    <h1>Delete Comment</h1>
    <p>Are you sure you want to delete this comment?</p>
    <p>{{ object.content }}</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirm Delete</button>
    </form>
    <p><a href="{% url 'post-detail' object.post.pk %}">Back to post</a></p>
</body>
</html>
