<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% if form.instance.pk %}Edit Comment{% else %}Add Comment{% endif %}</title>
</head>
<body>
    <h1>{% if form.instance.pk %}Edit Comment{% else %}Add Comment{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">{% if form.instance.pk %}Update{% else %}Post{% endif %}</button>
    </form>
    <p><a href="{% url 'post-detail' form.instance.post.pk %}">Back to post</a></p>
</body>
</html>
